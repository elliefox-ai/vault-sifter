// ─── Dupes ─────────────────────────────────────────────────────────────
const DupeState = {
    visible: false,
    confidence: 70,
    families: [],
    stats: null,
    toggles: new Map(), // rel -> 'keep' | 'dump'
    page: 1,
    totalPages: 1,
    totalFamilies: 0,
    expanded: new Set(), // family indices that are expanded past the member cap
    exactDupes: [], // streamed during hashing
    hideRejected: false,
};

const MEMBER_CAP = 8; // max thumbnails per family before "+N more"

function openDupes() {
    DupeState.visible = true;
    document.getElementById('dupe-panel').classList.add('visible');
    document.getElementById('btn-dupes').classList.add('active');
    loadDupeStatus();
    loadDupeFamilies();
}
function closeDupes() {
    DupeState.visible = false;
    document.getElementById('dupe-panel').classList.remove('visible');
    document.getElementById('btn-dupes').classList.remove('active');
}

async function loadDupeStatus() {
    try {
        const s = await api('/api/dupes/status');
        const el = document.getElementById('dupe-status');
        el.innerHTML = `Pool: <b>${escapeHtml(s.pool)}</b> · images <b>${s.images_on_disk}</b> · hashed <b>${s.hashed}</b> · edges <b>${s.has_edges ? '✓' : '—'}</b>`;
    } catch (e) {
        document.getElementById('dupe-status').textContent = 'dupe data unavailable';
    }
}

async function pullDupe() {
    const source = document.getElementById('dupe-source').value.trim();
    if (!source) { toast('Enter a source folder'); return; }
    toast('Pulling...');
    try {
        const r = await api('/api/dupes/pull', { method: 'POST', body: JSON.stringify({ source }) });
        toast(`Pulled ${r.moved} (${r.already} already there, ${r.exact_dupes} exact dupes) — ${r.errors.length} errors`);
        loadDupeStatus();
        loadDupeFamilies();
    } catch (e) {
        toast('Pull failed: ' + e.message);
    }
}

let clusterTimer;
async function clusterDupe() {
    const prog = document.getElementById('dupe-progress');
    try {
        const r = await api('/api/dupes/cluster', { method: 'POST', body: JSON.stringify({}) });
        if (r.status === 'already_running') { toast('Clustering already running'); return; }
        prog.textContent = 'Clustering...';
        DupeState.exactDupes = [];
        document.getElementById('btn-cluster').style.display = 'none';
        document.getElementById('btn-stop-cluster').style.display = '';
        const poll = async () => {
            const p = await api('/api/dupes/cluster/progress');
            if (p.running) {
                const pct = p.total > 0 ? Math.round(p.done / p.total * 100) : 0;
                prog.textContent = `${p.phase} ${p.done}/${p.total} (${pct}%)`;
                // Stream exact dupes as they're found
                if (p.exact_dupes && p.exact_dupes.length > DupeState.exactDupes.length) {
                    DupeState.exactDupes = p.exact_dupes;
                    renderDupeFamilies();
                }
                clusterTimer = setTimeout(poll, 1200);
            } else {
                document.getElementById('btn-cluster').style.display = '';
                document.getElementById('btn-stop-cluster').style.display = 'none';
                if (p.phase === 'done') {
                    prog.textContent = `Done — ${p.done} pairs`;
                    toast(`Clustered ${p.done} pairs`);
                } else if (p.phase === 'stopped') {
                    prog.textContent = `Stopped — ${p.done} hashed (saved, resumable)`;
                    toast('Scan stopped — progress saved, resume anytime');
                } else {
                    prog.textContent = 'Error';
                    toast('Cluster failed');
                }
                DupeState.exactDupes = [];
                loadDupeStatus();
                loadDupeFamilies();
            }
        };
        clusterTimer = setTimeout(poll, 800);
    } catch (e) {
        toast('Cluster error: ' + e.message);
    }
}

async function stopCluster() {
    try {
        await api('/api/dupes/cluster/stop', { method: 'POST', body: JSON.stringify({}) });
        toast('Stopping at next checkpoint...');
    } catch (e) {
        toast('Stop failed: ' + e.message);
    }
}

let famTimer;
function onConfidenceChange() {
    const val = parseInt(document.getElementById('dupe-confidence').value);
    DupeState.confidence = val;
    document.getElementById('dupe-conf-val').textContent = val;
    document.getElementById('dupe-threshold').textContent = `threshold ${Math.round((100 - val) * 0.4)}`;
    DupeState.page = 1; // reset to first page on slider change
    DupeState.expanded.clear();
    clearTimeout(famTimer);
    famTimer = setTimeout(loadDupeFamilies, 250);
}

async function loadDupeFamilies() {
    if (!DupeState.visible) return;
    try {
        const data = await api(`/api/dupes/families?confidence=${DupeState.confidence}&page=${DupeState.page}&per_page=10`);
        DupeState.families = data.families;
        DupeState.stats = data.stats;
        DupeState.pagination = data.pagination;
        if (data.pagination) {
            DupeState.totalPages = data.pagination.total_pages;
            DupeState.totalFamilies = data.pagination.total_families;
            // Clamp page if families shrank (e.g. after resolve)
            if (DupeState.page > DupeState.totalPages) {
                DupeState.page = DupeState.totalPages;
                return loadDupeFamilies();
            }
        }
        const present = new Set(data.families.flatMap(f => f.members.map(m => m.rel)));
        for (const rel of [...DupeState.toggles.keys()]) {
            if (!present.has(rel)) DupeState.toggles.delete(rel);
        }
        renderDupeFamilies();
    } catch (e) {
        document.getElementById('dupe-families').innerHTML = `<div class="dupe-empty">⚠️ ${escapeHtml(e.message)}</div>`;
    }
}

function renderDupeFamilies() {
    const list = document.getElementById('dupe-families');
    const stats = DupeState.stats;
    document.getElementById('dupe-summary').innerHTML = stats
        ? `<b>${stats.families}</b> families · <b>${stats.images_in_families}</b> images · <b>${stats.isolated}</b> isolated`
        : '';

    // Exact dupes found during hashing (teaser, not actionable)
    let exactHtml = '';
    if (DupeState.exactDupes.length) {
        exactHtml = `<div class="exact-dupes-bar">⚡ ${DupeState.exactDupes.length} exact dupes found during hashing — will appear in families once clustering completes</div>`;
    }

    if (!DupeState.families.length && !DupeState.exactDupes.length) {
        list.innerHTML = `${exactHtml}<div class="dupe-empty"><div class="big">🕵️</div><div>No dupe families at this confidence</div><div style="font-size:11px">Nudge the slider down to loosen the match</div></div>`;
        return;
    }
    if (!DupeState.families.length) {
        list.innerHTML = exactHtml;
        return;
    }

    const famNumOffset = (DupeState.page - 1) * 10;
    const cardsHtml = DupeState.families.map((f, fi) => {
        const isExpanded = DupeState.expanded.has(fi);
        let visibleMembers = isExpanded ? f.members : f.members.slice(0, MEMBER_CAP);
        if (DupeState.hideRejected) {
            visibleMembers = visibleMembers.filter(m => (DupeState.toggles.get(m.rel) || 'keep') !== 'dump');
        }
        const hiddenCount = (isExpanded ? 0 : f.members.length - MEMBER_CAP)
            + (DupeState.hideRejected ? f.members.filter(m => (DupeState.toggles.get(m.rel) || 'keep') === 'dump').length : 0);

        // Skip family entirely if all members are rejected and we're hiding
        if (DupeState.hideRejected && visibleMembers.length === 0) return '';

        const members = visibleMembers.map((m, mi) => {
            const st = DupeState.toggles.get(m.rel) || 'keep';
            const badge = st === 'dump' ? '🗑' : '✓';
            const thumb = m.id ? `/api/thumbnail/${m.id}` : '';
            return `
            <div class="fam-member ${st}" data-fi="${fi}" data-mi="${mi}" title="${escapeHtml(m.filename)}">
                ${thumb ? `<img src="${thumb}" loading="lazy">` : `<div style="width:120px;height:120px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-dim);">no thumb</div>`}
                <span class="fm-badge">${badge}</span>
                <div class="fm-name">${escapeHtml(m.filename)}${m.min_dist != null ? ` · ${m.min_dist}` : ''}</div>
            </div>`;
        }).join('');

        const kept = f.members.filter(m => (DupeState.toggles.get(m.rel) || 'keep') === 'keep').length;
        const dumped = f.members.length - kept;
        const expandBtn = hiddenCount > 0
            ? `<button class="btn" onclick="toggleExpandFamily(${fi})">${isExpanded ? 'Show less' : '+' + hiddenCount + ' more'}</button>`
            : '';
        return `
        <div class="family-card">
            <div class="family-head">
                <span class="fname">Family ${famNumOffset + fi + 1}</span>
                <span class="fmeta">${f.members.length} members · ${kept} keep / ${dumped} dump</span>
                <button class="btn" style="margin-left:auto;" onclick="reviewDupeFamily(${fi})">Review</button>
                <button class="btn" onclick="duelFamily(${fi})" title="Fast pairwise keep/dump review">⚔ Duel</button>
                <button class="btn" onclick="flipCompareFamily(${fi})">Flip</button>
                <button class="btn danger" onclick="dumpAllDupeMembers(${fi})">Dump all</button>
                <button class="btn primary" onclick="resolveDupeFamily(${fi})">Resolve →</button>
            </div>
            <div class="family-strip">${members}</div>
            ${expandBtn ? `<div style="padding:4px 12px;">${expandBtn}</div>` : ''}
        </div>`;
    }).join('');

    // Pagination controls
    const pag = DupeState.pagination;
    let pagHtml = '';
    if (pag && pag.total_pages > 1) {
        pagHtml = `<div class="dupe-pagination">
            ${DupeState.page > 1 ? `<button class="btn" onclick="dupePrevPage()">← Prev</button>` : ''}
            <span>Family page ${DupeState.page} of ${pag.total_pages} (${pag.total_families} families)</span>
            ${DupeState.page < pag.total_pages ? `<button class="btn" onclick="dupeNextPage()">Next →</button>` : ''}
        </div>`;
    }

    list.innerHTML = exactHtml + cardsHtml + pagHtml;
}

function toggleExpandFamily(fi) {
    if (DupeState.expanded.has(fi)) DupeState.expanded.delete(fi);
    else DupeState.expanded.add(fi);
    renderDupeFamilies();
}

function dupeNextPage() {
    if (DupeState.page < DupeState.totalPages) {
        DupeState.page++;
        DupeState.expanded.clear();
        loadDupeFamilies();
    }
}
function dupePrevPage() {
    if (DupeState.page > 1) {
        DupeState.page--;
        DupeState.expanded.clear();
        loadDupeFamilies();
    }
}

function toggleHideRejected() {
    DupeState.hideRejected = document.getElementById('hide-rejected').checked;
    renderDupeFamilies();
}

// ─── Duel: pairwise elimination compare (side-by-side / slider) ────────
//
// Instead of judging a whole family at once, walk it as a series of 1-on-1
// duels: champion vs challenger, pick a winner, next challenger steps up.
// That's N-1 decisions for N members instead of an N-way judgment call.
// Winners flow back into DupeState.toggles as 'keep', losers as 'dump',
// so the family strip + Resolve button downstream just work once you're done.

let duelState = null;

function duelFamily(fi) {
    const fam = DupeState.families[fi];
    if (!fam) return;
    // Only duel members not already dumped by hand — respect existing calls.
    const contenders = fam.members.filter(m => (DupeState.toggles.get(m.rel) || 'keep') === 'keep');
    if (contenders.length < 2) { toast('Need 2+ keepers to duel'); return; }

    duelState = {
        fi,
        mode: 'sidebyside', // 'sidebyside' | 'slider'
        champion: contenders[0],
        queue: contenders.slice(2),
        challenger: contenders[1],
        totalStart: contenders.length,
        decided: 0,
        history: [], // {champion, challenger, queue, decided, toggleSnapshot}
        done: false,
    };
    openDuelOverlay();
}

function openDuelOverlay() {
    let overlay = document.getElementById('duel-overlay');
    if (!overlay) {
        const el = document.createElement('div');
        el.id = 'duel-overlay';
        el.className = 'flip-overlay';
        el.innerHTML = `
            <div class="flip-toolbar">
                <button class="btn" id="duel-mode-btn" onclick="toggleDuelMode()">Slider view</button>
                <span class="flip-counter" id="duel-counter"></span>
                <button class="btn" id="duel-undo-btn" onclick="duelUndo()">↩ Undo</button>
                <button class="btn" style="margin-left:auto" onclick="closeDuel()">✕ Close</button>
            </div>
            <div class="flip-stage" id="duel-stage"></div>
            <div class="duel-actionbar" id="duel-actionbar"></div>
            <div class="flip-hint">← keep left · → keep right · ↓ keep both · Backspace undo</div>
        `;
        document.body.appendChild(el);
        overlay = el;
    }
    overlay.classList.add('visible');
    renderDuel();
}

function closeDuel() {
    const el = document.getElementById('duel-overlay');
    if (el) el.classList.remove('visible');
    duelState = null;
}

function toggleDuelMode() {
    if (!duelState) return;
    duelState.mode = duelState.mode === 'sidebyside' ? 'slider' : 'sidebyside';
    document.getElementById('duel-mode-btn').textContent =
        duelState.mode === 'sidebyside' ? 'Slider view' : 'Side-by-side view';
    renderDuel();
}

function qualityBadge(m) {
    if (m.quality_score == null) return '';
    const color = m.quality_score >= 75 ? 'var(--good)' : m.quality_score >= 50 ? 'var(--warn)' : 'var(--bad)';
    return `<span class="duel-qbadge" style="color:${color}">Q ${m.quality_score.toFixed(0)}</span>`;
}

function duelSuggestedSide() {
    // Purely advisory — never auto-decides. Only surfaces when scores exist and differ.
    const d = duelState;
    if (!d || d.champion.quality_score == null || d.challenger.quality_score == null) return null;
    if (d.champion.quality_score === d.challenger.quality_score) return null;
    return d.champion.quality_score > d.challenger.quality_score ? 'a' : 'b';
}

function renderDuel() {
    if (!duelState) return;
    const d = duelState;
    const stage = document.getElementById('duel-stage');
    const counter = document.getElementById('duel-counter');
    const remaining = d.queue.length + 1; // +1 for the current challenger still to be judged
    counter.textContent = `Family ${d.fi + 1} — ${d.decided} decided, ${remaining} to go`;

    const a = d.champion, b = d.challenger;
    const imgA = a.id ? `/api/fullimage/${a.id}` : '';
    const imgB = b.id ? `/api/fullimage/${b.id}` : '';
    const suggested = duelSuggestedSide();

    if (d.mode === 'sidebyside') {
        stage.classList.remove('slider-mode');
        stage.onmousemove = null;
        stage.innerHTML = `
            <div class="duel-pair">
                <div class="duel-side ${suggested === 'a' ? 'suggested' : ''}" onclick="duelPick('a')">
                    <img src="${imgA}" class="duel-img">
                    <div class="duel-caption">A ${qualityBadge(a)}${suggested === 'a' ? ' ★ suggested' : ''}<br><span class="duel-fname">${escapeHtml(a.filename)}</span></div>
                </div>
                <div class="duel-side ${suggested === 'b' ? 'suggested' : ''}" onclick="duelPick('b')">
                    <img src="${imgB}" class="duel-img">
                    <div class="duel-caption">B ${qualityBadge(b)}${suggested === 'b' ? ' ★ suggested' : ''}<br><span class="duel-fname">${escapeHtml(b.filename)}</span></div>
                </div>
            </div>
        `;
    } else {
        stage.classList.add('slider-mode');
        stage.innerHTML = `
            <div class="slider-container" id="slider-container">
                <img src="${imgB}" class="slider-img-b" id="slider-b">
                <img src="${imgA}" class="slider-img-a" id="slider-a">
                <div class="slider-handle" id="slider-handle"></div>
                <div class="slider-label-left">A: ${escapeHtml(a.filename)} ${qualityBadge(a)}${suggested === 'a' ? ' ★' : ''}</div>
                <div class="slider-label-right">B: ${escapeHtml(b.filename)} ${qualityBadge(b)}${suggested === 'b' ? ' ★' : ''}</div>
            </div>
        `;
        const container = document.getElementById('slider-container');
        const imgA_el = document.getElementById('slider-a');
        const handle = document.getElementById('slider-handle');
        imgA_el.style.clipPath = 'inset(0 50% 0 0)';
        handle.style.left = '50%';
        container.onmousemove = (e) => {
            const rect = container.getBoundingClientRect();
            const pct = ((e.clientX - rect.left) / rect.width) * 100;
            const clamped = Math.max(0, Math.min(100, pct));
            imgA_el.style.clipPath = `inset(0 ${100 - clamped}% 0 0)`;
            handle.style.left = clamped + '%';
        };
        // Dragging shouldn't accidentally register as a pick; slider mode uses buttons/keys only.
    }

    const actionbar = document.getElementById('duel-actionbar');
    actionbar.innerHTML = `
        <button class="btn primary" onclick="duelPick('a')">◀ Keep A</button>
        <button class="btn" onclick="duelPick('both')">Keep Both ▼</button>
        <button class="btn primary" onclick="duelPick('b')">Keep B ▶</button>
    `;
    document.getElementById('duel-undo-btn').disabled = d.history.length === 0;
}

function duelPick(side) {
    const d = duelState;
    if (!d || d.done) return;

    // Snapshot for undo (small maps, cheap to clone).
    d.history.push({
        champion: d.champion,
        challenger: d.challenger,
        queue: [...d.queue],
        decided: d.decided,
        toggleSnapshot: new Map(DupeState.toggles),
    });

    let winner;
    if (side === 'a') {
        DupeState.toggles.set(d.challenger.rel, 'dump');
        winner = d.champion;
    } else if (side === 'b') {
        DupeState.toggles.set(d.champion.rel, 'dump');
        winner = d.challenger;
    } else {
        // Keep both — no elimination, champion carries the torch forward.
        winner = d.champion;
    }
    d.decided++;

    if (d.queue.length === 0) {
        // Duel finished — winner is the sole survivor and is already 'keep' by default.
        d.done = true;
        d.champion = winner;
        renderDuelDone();
    } else {
        d.champion = winner;
        d.challenger = d.queue.shift();
        renderDuel();
    }
    renderDupeFamilies(); // reflect toggle changes in the family strip live
}

function renderDuelDone() {
    const d = duelState;
    const stage = document.getElementById('duel-stage');
    const counter = document.getElementById('duel-counter');
    counter.textContent = `Family ${d.fi + 1} — done, keeper: ${d.champion.filename}`;
    stage.classList.remove('slider-mode');
    stage.onmousemove = null;
    const img = d.champion.id ? `/api/fullimage/${d.champion.id}` : '';
    stage.innerHTML = `
        <div class="duel-done">
            <img src="${img}" class="flip-img">
            <div class="duel-caption">Keeper: ${escapeHtml(d.champion.filename)} ${qualityBadge(d.champion)}</div>
        </div>
    `;
    document.getElementById('duel-actionbar').innerHTML = `
        <button class="btn primary" onclick="closeDuel()">✓ Done — back to family</button>
    `;
}

function duelUndo() {
    const d = duelState;
    if (!d || !d.history.length) return;
    const prev = d.history.pop();
    d.champion = prev.champion;
    d.challenger = prev.challenger;
    d.queue = prev.queue;
    d.decided = prev.decided;
    d.done = false;
    DupeState.toggles = prev.toggleSnapshot;
    renderDuel();
    renderDupeFamilies();
}

// Wire keyboard for the duel overlay
document.addEventListener('keydown', (e) => {
    const overlay = document.getElementById('duel-overlay');
    if (!overlay || !overlay.classList.contains('visible')) return;
    if (!duelState) return;
    if (duelState.done) {
        if (e.key === 'Escape') { e.preventDefault(); closeDuel(); }
        return;
    }
    switch (e.key) {
        case 'ArrowLeft': e.preventDefault(); duelPick('a'); break;
        case 'ArrowRight': e.preventDefault(); duelPick('b'); break;
        case 'ArrowDown': e.preventDefault(); duelPick('both'); break;
        case 'Backspace': e.preventDefault(); duelUndo(); break;
        case 'v': case 'V': e.preventDefault(); toggleDuelMode(); break;
        case 'Escape': e.preventDefault(); closeDuel(); break;
    }
});



// ─── Flip / Slider Compare ─────────────────────────────────────────────

let flipState = null;

function flipCompareFamily(fi) {
    const fam = DupeState.families[fi];
    if (!fam || fam.members.length < 2) { toast('Need 2+ members'); return; }
    const members = fam.members.filter(m => (DupeState.toggles.get(m.rel) || 'keep') === 'keep');
    const pool = members.length >= 2 ? members : fam.members;
    flipState = { fi, members: pool, idx: 0, mode: 'flip' };
    openFlipOverlay();
}

function openFlipOverlay() {
    const overlay = document.getElementById('flip-overlay');
    if (!overlay) {
        // Create overlay if it doesn't exist
        const el = document.createElement('div');
        el.id = 'flip-overlay';
        el.className = 'flip-overlay';
        el.innerHTML = `
            <div class="flip-toolbar">
                <button class="btn" id="flip-mode-btn" onclick="toggleFlipMode()">Flip</button>
                <span class="flip-counter" id="flip-counter"></span>
                <button class="btn" onclick="flipAdvance(1)">→</button>
                <button class="btn" onclick="flipAdvance(-1)">←</button>
                <button class="btn" style="margin-left:auto" onclick="closeFlip()">✕ Close</button>
            </div>
            <div class="flip-stage" id="flip-stage"></div>
            <div class="flip-hint">Click or use ← → keys · Press S for slider mode</div>
        `;
        document.body.appendChild(el);
    }
    document.getElementById('flip-overlay').classList.add('visible');
    renderFlip();
}

function closeFlip() {
    const el = document.getElementById('flip-overlay');
    if (el) el.classList.remove('visible');
    flipState = null;
}

function flipAdvance(dir) {
    if (!flipState) return;
    flipState.idx = (flipState.idx + dir + flipState.members.length) % flipState.members.length;
    renderFlip();
}

function toggleFlipMode() {
    if (!flipState) return;
    flipState.mode = flipState.mode === 'flip' ? 'slider' : 'flip';
    document.getElementById('flip-mode-btn').textContent = flipState.mode === 'flip' ? 'Flip' : 'Slider';
    renderFlip();
}

function renderFlip() {
    if (!flipState) return;
    const stage = document.getElementById('flip-stage');
    const counter = document.getElementById('flip-counter');
    const m = flipState.members[flipState.idx];
    counter.textContent = `${flipState.idx + 1} / ${flipState.members.length} — ${m.filename}`;

    if (flipState.mode === 'flip') {
        // Single image, click or arrow keys to cycle
        const imgSrc = m.id ? `/api/fullimage/${m.id}` : '';
        stage.innerHTML = `<img src="${imgSrc}" class="flip-img" onclick="flipAdvance(1)">`;
        stage.classList.remove('slider-mode');
        stage.onmousemove = null;
    } else {
        // Slider mode: current image + next one, wipe between them
        const nextIdx = (flipState.idx + 1) % flipState.members.length;
        const next = flipState.members[nextIdx];
        const imgA = m.id ? `/api/fullimage/${m.id}` : '';
        const imgB = next.id ? `/api/fullimage/${next.id}` : '';
        stage.classList.add('slider-mode');
        stage.innerHTML = `
            <div class="slider-container" id="slider-container">
                <img src="${imgB}" class="slider-img-b" id="slider-b">
                <img src="${imgA}" class="slider-img-a" id="slider-a">
                <div class="slider-handle" id="slider-handle"></div>
                <div class="slider-label-left">A: ${escapeHtml(m.filename)}</div>
                <div class="slider-label-right">B: ${escapeHtml(next.filename)}</div>
            </div>
        `;
        const container = document.getElementById('slider-container');
        const imgA_el = document.getElementById('slider-a');
        const handle = document.getElementById('slider-handle');
        imgA_el.style.clipPath = 'inset(0 50% 0 0)';
        handle.style.left = '50%';
        container.onmousemove = (e) => {
            const rect = container.getBoundingClientRect();
            const pct = ((e.clientX - rect.left) / rect.width) * 100;
            const clamped = Math.max(0, Math.min(100, pct));
            imgA_el.style.clipPath = `inset(0 ${100 - clamped}% 0 0)`;
            handle.style.left = clamped + '%';
        };
    }
}

// Wire keyboard for flip overlay
document.addEventListener('keydown', (e) => {
    const overlay = document.getElementById('flip-overlay');
    if (!overlay || !overlay.classList.contains('visible')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); flipAdvance(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); flipAdvance(-1); }
    else if (e.key === 's' || e.key === 'S') { e.preventDefault(); toggleFlipMode(); }
    else if (e.key === 'Escape') { e.preventDefault(); closeFlip(); }
});

function toggleDupeMember(fi, mi) {
    const fam = DupeState.families[fi];
    if (!fam) return;
    const m = fam.members[mi];
    if (!m) return;
    const cur = DupeState.toggles.get(m.rel) || 'keep';
    DupeState.toggles.set(m.rel, cur === 'keep' ? 'dump' : 'keep');
    renderDupeFamilies();
}

function dumpAllDupeMembers(fi) {
    const fam = DupeState.families[fi];
    if (!fam) return;
    fam.members.forEach(m => DupeState.toggles.set(m.rel, 'dump'));
    renderDupeFamilies();
}

async function reviewDupeFamily(fi) {
    const fam = DupeState.families[fi];
    if (!fam) return;
    const ids = fam.members.map(m => m.id).filter(Boolean);
    if (ids.length < 2) { toast('Need 2+ indexed members to compare'); return; }
    State.selected = new Set(ids);
    await openCompare();
}

async function resolveDupeFamily(fi) {
    const fam = DupeState.families[fi];
    if (!fam) return;
    const keep = fam.members.filter(m => (DupeState.toggles.get(m.rel) || 'keep') === 'keep').map(m => m.filepath);
    const reject = fam.members.filter(m => (DupeState.toggles.get(m.rel) || 'keep') === 'dump').map(m => m.filepath);
    if (!keep.length || !reject.length) { toast('Mark at least one member to dump'); return; }
    if (!confirm(`Keep ${keep.length} → curated, dump ${reject.length}?`)) return;
    try {
        const r = await api('/api/dupes/resolve', {
            method: 'POST',
            body: JSON.stringify({ keep, reject }),
        });
        toast(`Resolved: ${r.kept.length} kept, ${r.trashed.length} trashed${r.errors.length ? `, ${r.errors.length} errors` : ''}`);
        DupeState.families.splice(fi, 1);
        for (const m of fam.members) DupeState.toggles.delete(m.rel);
        loadDupeStatus();
        loadDupeFamilies();
        loadImages(); // refresh gallery (DB rows moved/deleted)
    } catch (e) {
        toast('Resolve failed: ' + e.message);
    }
}

// Dupe family member clicks (delegated)
document.getElementById('dupe-families').addEventListener('click', (e) => {
    const el = e.target.closest('.fam-member');
    if (!el) return;
    toggleDupeMember(parseInt(el.dataset.fi), parseInt(el.dataset.mi));
});

document.getElementById('btn-dupes').addEventListener('click', () => {
    DupeState.visible ? closeDupes() : openDupes();
});

// ─── Utils ─────────────────────────────────────────────────────────────
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// --- Init -----------------------------------------------------------------
restoreFilterUI();

(async () => {
    await loadImages();
    if (State.cursor < State.images.length) {
        const img = State.images[State.cursor];
        openDetail(img);
        updateCursorHighlight();
    }
})();
</script>
