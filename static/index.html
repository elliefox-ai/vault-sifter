<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Sifter</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --surface-hover: #252525;
            --border: #333;
            --text: #e0e0e0;
            --text-dim: #888;
            --accent: #4a9eff;
            --good: #4ec96e;
            --warn: #f0a040;
            --bad: #e05050;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* ─── Top Bar ─── */
        .topbar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 12px;
            padding: 8px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            min-height: 52px;
            flex-shrink: 0;
        }
        .topbar .logo {
            font-weight: 700;
            font-size: 16px;
            white-space: nowrap;
        }
        .topbar .logo span { color: var(--accent); }
        .stats {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: var(--text-dim);
        }
        .stats b { color: var(--text); }

        /* ─── Filters ─── */
        .filters {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 8px;
            margin-left: auto;
        }
        .filters input, .filters select {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
        }
        .filters input:focus, .filters select:focus {
            border-color: var(--accent);
        }
        .filters input[type="search"] { width: 200px; }
        .btn {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.15s;
        }
        .btn:hover { background: var(--surface-hover); }
        .btn.active { border-color: var(--accent); color: var(--accent); }

        /* ─── Main Layout ─── */
        .main {
            display: flex;
            height: calc(100vh - 52px);
        }

        /* ─── Sidebar ─── */
        .sidebar {
            width: 340px;
            min-width: 240px;
            max-width: 80vw;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: none;
            flex-direction: column;
            resize: horizontal;
            overflow: auto;
        }
        .sidebar.visible { display: flex; }
        .detail-img {
            width: 100%;
            display: block;
        }
        .detail-meta {
            padding: 12px 16px;
            font-size: 12px;
            line-height: 1.6;
        }
        .detail-meta .label { color: var(--text-dim); }
        .detail-meta .value { color: var(--text); margin-bottom: 8px; }
        .detail-meta .prompt-box {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 4px;
            max-height: 200px;
            overflow-y: auto;
            font-family: "SF Mono", "Cascadia Code", monospace;
            font-size: 11px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .detail-actions {
            padding: 12px 16px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ─── Gallery ─── */
        .gallery {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
        }
        .card {
            position: relative;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            background: var(--surface);
            border: 2px solid transparent;
            transition: border-color 0.1s;
        }
        .card:hover { border-color: var(--surface-hover); }
        .card.selected { border-color: var(--accent); }
        .card.rejected { opacity: 0.3; }
        .card.flagged::after {
            content: "⚑";
            position: absolute;
            top: 4px; right: 4px;
            color: var(--warn);
            font-size: 14px;
            text-shadow: 0 0 4px black;
        }
        .card img {
            width: 100%;
            display: block;
            aspect-ratio: 1;
            object-fit: cover;
            background: #111;
        }
        .card-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            padding: 20px 6px 4px;
            font-size: 10px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
        }
        .rating {
            position: absolute;
            top: 4px; left: 4px;
            display: flex;
            gap: 1px;
        }
        .rating .star {
            color: var(--warn);
            font-size: 10px;
            text-shadow: 0 0 3px black;
        }

        /* ─── Compare Modal ─── */
        .compare-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            padding: 40px;
            overflow: auto;
        }
        .compare-overlay.visible { display: flex; gap: 16px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }

        /* ─── Compare Cards ─── */
        .compare-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 48%;
        }
        .compare-img {
            max-height: 70vh;
            max-width: 100%;
            object-fit: contain;
            border-radius: 4px;
        }
        .compare-meta {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 12px;
            font-size: 12px;
            color: var(--text-dim);
        }
        .compare-filename {
            font-size: 11px;
            color: var(--text);
            margin-bottom: 8px;
            word-break: break-all;
        }
        .compare-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
        }
        .compare-row b { color: var(--text); }
        .compare-prompt {
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-dim);
            font-style: italic;
            line-height: 1.4;
            max-height: 60px;
            overflow: auto;
        }
        .compare-actions {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .compare-actions .btn { font-size: 11px; padding: 2px 6px; }
        .compare-close {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 101;
        }

        /* ─── Bulk Action Bar ─── */
        .bulk-bar {
            display: none;
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            border: 1px solid var(--accent);
            border-radius: 6px;
            padding: 8px 16px;
            gap: 8px;
            align-items: center;
            z-index: 50;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .bulk-bar.visible { display: flex; }
        .bulk-bar span { font-size: 12px; color: var(--text-dim); margin-right: 4px; }

        /* ─── Fullscreen Preview ─── */
        .preview-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 90;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }
        .preview-overlay.visible { display: flex; }
        .preview-overlay img {
            max-width: 95vw;
            max-height: 90vh;
            object-fit: contain;
        }
        .preview-hud {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            padding: 12px 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            color: #fff;
            font-size: 14px;
            font-family: monospace;
            display: flex;
            gap: 16px;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .preview-stars { color: #ffd700; font-size: 16px; letter-spacing: 2px; }
        .preview-flags { color: #ff6b6b; }
        .preview-counter { color: #aaa; }

        /* ─── Toast ─── */
        .toast {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 200;
            pointer-events: none;
        }
        .toast.visible { opacity: 1; }

        /* ─── Empty State ─── */
        .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-dim);
            gap: 8px;
        }
        .empty .big { font-size: 48px; }

        /* ─── Pagination ─── */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 16px;
            color: var(--text-dim);
            font-size: 12px;
        }
        .page-btn { padding: 2px 8px !important; min-width: 28px; font-size: 11px; }
        .page-btn.current { background: var(--accent); color: #fff; border-color: var(--accent); }
        .page-ellipsis { color: var(--text-dim); padding: 0 4px; }
        .page-jump { display: flex; align-items: center; gap: 4px; }
        .page-jump input {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 3px;
            padding: 2px 4px;
            font-size: 12px;
        }

        /* ─── Keyboard Hint ─── */
        .kbd-hint {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 10px;
            color: var(--text-dim);
            z-index: 50;
        }
        .kbd-hint kbd {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 1px 4px;
            font-family: monospace;
            font-size: 10px;
            color: var(--text);
        }

        /* ─── Dupe Panel ─── */
        .dupe-panel {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg);
            z-index: 60;
            flex-direction: column;
            overflow-y: auto;
            padding: 24px;
            gap: 16px;
        }
        .dupe-panel.visible { display: flex; }
        .dupe-header { display: flex; align-items: center; gap: 12px; }
        .dupe-header h2 { font-size: 16px; }
        .dupe-status { font-size: 12px; color: var(--text-dim); }
        .dupe-status b { color: var(--text); }
        .dupe-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .dupe-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .dupe-row label { font-size: 12px; color: var(--text-dim); }
        .dupe-row input[type="text"] {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 13px;
            flex: 1;
            min-width: 200px;
            outline: none;
        }
        .dupe-row input[type="text"]:focus { border-color: var(--accent); }
        .dupe-row input[type="range"] { flex: 1; min-width: 200px; accent-color: var(--accent); }
        .dupe-conf-label { font-size: 14px; font-weight: 700; color: var(--accent); min-width: 34px; text-align: center; }
        .dupe-threshold { font-size: 11px; color: var(--text-dim); }
        .dupe-summary { font-size: 12px; color: var(--text-dim); }
        .dupe-summary b { color: var(--text); }
        .dupe-progress { font-size: 12px; color: var(--accent); }
        .family-list { display: flex; flex-direction: column; gap: 12px; }
        .family-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
        }
        .family-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .family-head .fname { font-size: 13px; font-weight: 600; }
        .family-head .fmeta { font-size: 11px; color: var(--text-dim); }
        .family-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
        .fam-member {
            position: relative;
            flex-shrink: 0;
            width: 120px;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            border: 3px solid var(--good);
            transition: border-color 0.1s;
        }
        .fam-member.dump { border-color: var(--bad); opacity: 0.45; }
        .fam-member img { width: 120px; height: 120px; object-fit: cover; display: block; background: #111; }
        .fam-member .fm-badge {
            position: absolute; top: 4px; right: 4px;
            font-size: 12px;
            background: rgba(0,0,0,0.7);
            border-radius: 4px;
            padding: 1px 5px;
            color: var(--good);
        }
        .fam-member.dump .fm-badge { color: var(--bad); }
        .fam-member .fm-name {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            font-size: 9px;
            color: var(--text-dim);
            padding: 14px 4px 3px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .fam-actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
        .fam-actions .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
            font-weight: 600;
        }
        .fam-actions .btn.danger { border-color: var(--bad); color: var(--bad); }
        .dupe-empty { padding: 40px; text-align: center; color: var(--text-dim); }
        .dupe-empty .big { font-size: 42px; margin-bottom: 10px; }

        /* ─── Dupe Pagination ─── */
        .dupe-pagination {
            display: flex; justify-content: center; align-items: center; gap: 12px;
            padding: 12px; font-size: 12px; color: var(--text-dim);
        }
        .exact-dupes-bar {
            background: rgba(74, 158, 255, 0.1); border: 1px solid var(--accent);
            border-radius: 4px; padding: 8px 12px; margin: 8px 0;
            font-size: 12px; color: var(--accent);
        }

        /* ─── Flip / Slider Compare ─── */
        .flip-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.95); z-index: 10000;
            flex-direction: column; align-items: center;
        }
        .flip-overlay.visible { display: flex; }
        .flip-toolbar {
            display: flex; align-items: center; gap: 12px; padding: 12px 20px;
            width: 100%; box-sizing: border-box; border-bottom: 1px solid var(--border);
        }
        .flip-counter { font-size: 13px; color: var(--text-dim); min-width: 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 400px; }
        .flip-stage { flex: 1; display: flex; align-items: center; justify-content: center;
            width: 100%; overflow: hidden; position: relative; }
        .flip-img { max-width: 90vw; max-height: 80vh; object-fit: contain; cursor: pointer; }
        .flip-hint { padding: 8px; font-size: 11px; color: var(--text-dim); }

        .slider-container { position: relative; max-width: 90vw; max-height: 75vh; display: inline-block; cursor: ew-resize; }
        .slider-img-a, .slider-img-b {
            display: block; max-width: 90vw; max-height: 75vh; object-fit: contain;
            user-select: none; -webkit-user-drag: none;
        }
        .slider-img-a { position: absolute; top: 0; left: 0; }
        .slider-handle {
            position: absolute; top: 0; bottom: 0; width: 4px; background: var(--accent);
            transform: translateX(-50%); pointer-events: none; z-index: 10;
        }
        .slider-handle::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--accent); opacity: 0.8;
        }
        .slider-label-left, .slider-label-right {
            position: absolute; bottom: 8px; font-size: 11px; color: #fff;
            background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 3px;
            pointer-events: none;
        }
        .slider-label-left { left: 8px; }
        .slider-label-right { right: 8px; }
        /* ─── Duel Compare (side-by-side + slider, pairwise elimination) ─── */
        .duel-pair {
            display: flex; gap: 16px; align-items: flex-start; justify-content: center;
            width: 100%; padding: 0 24px; box-sizing: border-box;
        }
        .duel-side {
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            max-width: 46vw; cursor: pointer; border-radius: 8px; padding: 8px;
            border: 2px solid transparent; transition: border-color 0.12s, background 0.12s;
        }
        .duel-side:hover { border-color: var(--border); background: rgba(255,255,255,0.03); }
        .duel-side.suggested { border-color: var(--accent); }
        .duel-img {
            max-width: 46vw; max-height: 72vh; object-fit: contain;
            border-radius: 4px; display: block;
        }
        .duel-caption {
            font-size: 12px; color: var(--text-dim); text-align: center; line-height: 1.5;
        }
        .duel-fname {
            font-size: 11px; color: var(--text); word-break: break-all;
        }
        .duel-qbadge {
            font-weight: 700; font-size: 11px; background: rgba(0,0,0,0.4);
            padding: 1px 6px; border-radius: 3px; margin-left: 4px;
        }
        .duel-actionbar {
            display: flex; gap: 10px; align-items: center; justify-content: center;
            padding: 14px; width: 100%; box-sizing: border-box;
        }
        .duel-actionbar .btn { font-size: 13px; padding: 8px 18px; }
        .duel-actionbar .btn.primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
        .duel-done {
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        #duel-undo-btn:disabled { opacity: 0.35; cursor: default; }
    </style>
</head>
<body>

<div class="topbar">
    <div class="logo">Vault<span>Sifter</span><div id="vault-display" style="font-size:10px;color:var(--text-dim);font-weight:normal;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title=""></div></div>
    <div class="stats">
        <span>Total: <b id="stat-total">—</b></span>
        <span>Unrated: <b id="stat-unrated">—</b></span>
        <span>Rated: <b id="stat-rated">—</b></span>
        <span>Rejected: <b id="stat-rejected">—</b></span>
    </div>
    <div class="filters">
        <input type="search" id="search" placeholder="Search prompts...">
        <select id="sort">
            <option value="file_modified-desc">Newest first</option>
            <option value="file_modified-asc">Oldest first</option>
            <option value="rating-desc">Highest rated</option>
            <option value="quality_score-desc">Best quality</option>
            <option value="sharpness-desc">Sharpest</option>
            <option value="saturation-desc">Most colorful</option>
            <option value="filesize-desc">Largest file</option>
            <option value="filename-asc">Name A-Z</option>
        </select>
        <button class="btn" id="filter-unrated" title="Show unrated only">Unrated only</button>
        <button class="btn" id="filter-rejected" title="Show rejected">Show rejected</button>
        <select id="quality-filter" title="Filter by quality score" style="width: 110px;">
            <option value="">Any quality</option>
            <option value="75">≥ 75 (good)</option>
            <option value="50">≥ 50 (ok)</option>
            <option value="25">≥ 25 (low)</option>
            <option value="0-49">0–49 (poor)</option>
        </select>
        <button class="btn" id="btn-compare" title="Compare selected">Compare</button>
        <button class="btn" id="btn-analyze" title="Run quality analysis">Analyze</button>
        <button class="btn" id="btn-reindex" title="Re-index vault">Re-index</button>
        <button class="btn" id="btn-dupes" title="Near-dupe review">Dupes</button>
        <input type="text" id="load-path" list="vault-recent" placeholder="E:\\path\\to\\vault" style="width: 170px; max-width: 26vw; min-width: 110px;" title="Type a folder path, then click Load Folder (or press Enter)">
        <datalist id="vault-recent"></datalist>
        <button class="btn" id="btn-load" title="Switch to a different folder without restarting">Load Folder</button>
    </div>
</div>

<div class="bulk-bar" id="bulk-bar">
    <span id="bulk-count">0 selected</span>
    <button class="btn" onclick="bulkRate(3)">Rate ★3</button>
    <button class="btn" onclick="bulkRate(4)">★4</button>
    <button class="btn" onclick="bulkRate(5)">★5</button>
    <button class="btn" onclick="bulkReject()">Reject All</button>
    <button class="btn" onclick="clearSelection()">Clear</button>
</div>

<div class="main">
    <div class="sidebar" id="sidebar">
        <img class="detail-img" id="detail-img" src="">
        <div class="detail-actions">
            <button class="btn" onclick="rateCurrent(1)">★</button>
            <button class="btn" onclick="rateCurrent(2)">★★</button>
            <button class="btn" onclick="rateCurrent(3)">★★★</button>
            <button class="btn" onclick="rateCurrent(4)">★★★★</button>
            <button class="btn" onclick="rateCurrent(5)">★★★★★</button>
            <button class="btn" onclick="rateCurrent(0)">Clear</button>
            <button class="btn" onclick="toggleFlag()">⚑ Flag</button>
            <button class="btn" onclick="toggleReject()" style="color: var(--bad)">✕ Reject</button>
        </div>
        <div class="detail-meta" id="detail-meta"></div>
        <div style="padding: 0 16px 12px; border-top: 1px solid var(--border); margin-top: 8px;">
            <div style="color: var(--text-dim); font-size: 12px; margin-top: 8px; margin-bottom: 4px;">Tags</div>
            <div id="detail-tags-display" style="font-size: 11px; color: var(--accent); margin-bottom: 4px;"></div>
            <div style="display: flex; gap: 4px; align-items: center; flex-wrap: wrap;">
                <input type="text" id="tag-input" placeholder="Add tags..." style="background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 4px; font-size: 12px; flex: 1; min-width: 120px;">
                <button class="btn" onclick="saveTags()" style="font-size: 11px;">Save</button>
            </div>
        </div>
    </div>

    <div class="gallery" id="gallery">
        <div class="gallery-grid" id="grid"></div>
        <div class="pagination" id="pagination"></div>
    </div>
</div>

<div class="preview-overlay" id="preview">
    <img id="preview-img" src="">
    <div class="preview-hud" id="preview-hud"></div>
</div>

<div class="compare-overlay" id="compare"></div>

<div class="dupe-panel" id="dupe-panel">
    <div class="dupe-header">
        <h2>Near-Dupe Review</h2>
        <span class="dupe-status" id="dupe-status">—</span>
        <button class="btn" style="margin-left:auto;" onclick="closeDupes()">✕ Close</button>
    </div>
    <div class="dupe-section">
        <div class="dupe-row">
            <button class="btn" id="btn-cluster" onclick="clusterDupe()" style="font-weight:600">🔍 Scan this vault for dupes</button>
            <button class="btn" id="btn-stop-cluster" onclick="stopCluster()" style="display:none">⏹ Stop</button>
            <span class="dupe-progress" id="dupe-progress"></span>
        </div>
        <div class="dupe-row" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">
            <label style="color:var(--text-dim)">Optional: pull from another folder first</label>
            <input type="text" id="dupe-source" placeholder="\\server\\share\\folder or /path/to/folder">
            <button class="btn" onclick="pullDupe()">Pull into pool</button>
        </div>
        <div class="dupe-row">
            <label>Confidence</label>
            <input type="range" id="dupe-confidence" min="0" max="100" value="70" oninput="onConfidenceChange()">
            <span class="dupe-conf-label" id="dupe-conf-val">70</span>
            <span class="dupe-threshold" id="dupe-threshold">threshold 12</span>
            <span class="dupe-summary" id="dupe-summary"></span>
            <label style="margin-left:16px;display:flex;align-items:center;gap:4px;cursor:pointer">
                <input type="checkbox" id="hide-rejected" onchange="toggleHideRejected()"> Hide rejected
            </label>
        </div>
    </div>
    <div class="family-list" id="dupe-families"></div>
</div>

<div class="toast" id="toast"></div>

<div class="kbd-hint">
    <kbd>J</kbd>/<kbd>K</kbd> nav · <kbd>1-5</kbd> rate · <kbd>X</kbd> reject · <kbd>F</kbd> flag · <kbd>Space</kbd> preview (rate/nav/flag inside!) · <kbd>Backspace</kbd> undo · <kbd>C</kbd> compare · <kbd>Esc</kbd> close
</div>

<script>
// ─── State ─────────────────────────────────────────────────────────────
// --- State persistence ---
const SAVED_KEYS = ['cursor', 'offset', 'filters', 'limit'];

function saveState() {
    const saved = {};
    SAVED_KEYS.forEach(k => saved[k] = State[k]);
    try { localStorage.setItem('vault-sifter', JSON.stringify(saved)); } catch(e) {}
}

function loadSavedState() {
    try {
        const raw = localStorage.getItem('vault-sifter');
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (saved.cursor != null) State.cursor = saved.cursor;
        if (saved.offset != null) State.offset = saved.offset;
        if (saved.limit != null) State.limit = saved.limit;
        if (saved.filters) Object.assign(State.filters, saved.filters);
        // Scrub path-like search text — a vault path pasted into the search
        // box matches no prompts and silently filters the grid to zero.
        if (State.filters.q && /(^\\\\|^[A-Za-z]:[\\/])/.test(State.filters.q)) {
            State.filters.q = '';
        }
    } catch(e) {}
}

function restoreFilterUI() {
    document.getElementById('search').value = State.filters.q || '';
    document.getElementById('sort').value = `${State.filters.sort}-${State.filters.sort_dir}`;
    document.getElementById('filter-unrated').classList.toggle('active', State.filters.unrated_only);
    document.getElementById('filter-rejected').classList.toggle('active', State.filters.include_rejected);
    // Quality filter
    const qf = document.getElementById('quality-filter');
    const minq = State.filters.min_quality;
    const maxq = State.filters.max_quality;
    if (minq === 0 && maxq === 999) qf.value = '';
    else if (maxq === 999) qf.value = String(minq);
    else qf.value = `${minq}-${maxq}`;
}

const State = {
    images: [],
    cursor: 0,
    selected: new Set(), // for compare
    filters: {
        q: '',
        sort: 'file_modified',
        sort_dir: 'desc',
        unrated_only: false,
        include_rejected: false,
        min_quality: 0,
        max_quality: 999,
    },
    limit: 50,
    offset: 0,
    total: 0,
    detailId: null,
};

loadSavedState();

// ─── API ───────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
    const res = await fetch(path, {
        headers: { 'Content-Type': 'application/json' },
        ...opts,
    });
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    return res.json();
}

// ─── Load Images ───────────────────────────────────────────────────────
async function loadImages() {
    const params = new URLSearchParams();
    if (State.filters.q) params.set('q', State.filters.q);
    params.set('sort', State.filters.sort);
    params.set('sort_dir', State.filters.sort_dir);
    params.set('unrated_only', State.filters.unrated_only);
    params.set('include_rejected', State.filters.include_rejected);
    if (State.filters.min_quality > 0) params.set('min_quality', State.filters.min_quality);
    if (State.filters.max_quality < 999) params.set('max_quality', State.filters.max_quality);
    params.set('limit', State.limit);
    params.set('offset', State.offset);

    let data;
    try {
        data = await api(`/api/images?${params}`);
    } catch (e) {
        if (String(e.message).startsWith('409')) {
            State.images = [];
            State.total = 0;
            const grid = document.getElementById('grid');
            grid.innerHTML = '<div class="empty"><div class="big">📁</div><div>No vault loaded</div><div>Paste a folder path in the box above, then press Enter or click Load Folder</div></div>';
            document.getElementById('pagination').innerHTML = '';
            return;
        }
        throw e;
    }
    State.images = data.images;
    State.total = data.total;
    // Clamp cursor to valid range after page load
    if (State.cursor >= State.images.length) State.cursor = Math.max(0, State.images.length - 1);
    renderGrid();
    loadStats();
    saveState();
}

// ─── Stats ─────────────────────────────────────────────────────────────
async function loadStats() {
    const s = await api('/api/stats');
    document.getElementById('stat-total').textContent = s.total;
    document.getElementById('stat-unrated').textContent = s.unrated;
    document.getElementById('stat-rated').textContent = s.rated;
    document.getElementById('stat-rejected').textContent = s.rejected;
}

// ─── Render ────────────────────────────────────────────────────────────
function renderGrid() {
    const grid = document.getElementById('grid');

    if (State.images.length === 0) {
        grid.innerHTML = '<div class="empty"><div class="big">📂</div><div>No images found</div><div>Try adjusting filters or re-indexing</div></div>';
        document.getElementById('pagination').innerHTML = '';
        return;
    }

    grid.innerHTML = State.images.map((img, i) => {
        const stars = '★'.repeat(img.rating);
        const cls = [
            'card',
            img.rejected ? 'rejected' : '',
            img.flag ? 'flagged' : '',
            State.selected.has(img.id) ? 'selected' : '',
            State.cursor === i ? 'cursor' : '',
        ].filter(Boolean).join(' ');

        const sizeStr = img.width && img.height ? `${img.width}×${img.height}` : '';
        const sizeKB = img.filesize ? `${(img.filesize/1024).toFixed(0)}KB` : '';
        const date = img.file_modified ? new Date(img.file_modified * 1000).toLocaleDateString() : '';
        const qs = img.quality_score != null ? img.quality_score.toFixed(0) : '—';
        const qsColor = qs >= 75 ? 'var(--good)' : qs >= 50 ? 'var(--warn)' : 'var(--bad)';

        return `
            <div class="${cls}" data-idx="${i}" data-id="${img.id}" onclick="onCardClick(${i}, event)">
                <div class="rating">${stars ? `<span class="star">${stars}</span>` : ''}</div>
                ${img.quality_score != null ? `<div style="position:absolute;top:4px;right:${img.flag ? '20px' : '4px'};background:rgba(0,0,0,0.7);color:${qsColor};font-size:10px;padding:1px 4px;border-radius:3px;font-weight:600;">${qs}</div>` : ''}
                <img src="/api/thumbnail/${img.id}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22180%22 height=%22180%22><rect fill=%22%23111%22 width=%22180%22 height=%22180%22/><text fill=%22%23666%22 x=%2250%22 y=%2290%22 font-size=%2214%22>error</text></svg>'">
                <div class="card-overlay">
                    <span>${date}</span>
                    <span>${sizeStr || sizeKB}</span>
                </div>
            </div>
        `;
    }).join('');

    // Highlight cursor
    updateCursorHighlight();

    // Pagination
    const pag = document.getElementById('pagination');
    const page = Math.floor(State.offset / State.limit) + 1;
    const totalPages = Math.ceil(State.total / State.limit) || 1;

    // Build compact page button list
    let pageBtns = '';
    const showPages = new Set();
    showPages.add(1);
    showPages.add(totalPages);
    showPages.add(page);
    if (page > 1) showPages.add(page - 1);
    if (page < totalPages) showPages.add(page + 1);
    const sorted = [...showPages].filter(p => p >= 1 && p <= totalPages).sort((a, b) => a - b);
    let prevP = 0;
    for (const p of sorted) {
        if (prevP && p > prevP + 1) pageBtns += '<span class="page-ellipsis">…</span>';
        pageBtns += `<button class="btn page-btn${p === page ? ' current' : ''}" onclick="goToPage(${p})">${p}</button>`;
        prevP = p;
    }

    pag.innerHTML = `
        ${State.offset > 0 ? `<button class="btn" onclick="prevPage()">← Prev</button>` : ''}
        <span class="page-jump"><input type="number" id="page-input" min="1" max="${totalPages}" value="${page}" onchange="goToPage(this.value)" style="width:48px;text-align:center;"> / ${totalPages}</span>
        <span class="page-btns">${pageBtns}</span>
        ${page < totalPages ? `<button class="btn" onclick="nextPage()">Next →</button>` : ''}
    `;
}

function updateCursorHighlight() {
    document.querySelectorAll('.card').forEach((el, i) => {
        const idx = parseInt(el.dataset.idx);
        if (idx === State.cursor) {
            el.style.outline = '3px solid var(--accent)';
            el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        } else {
            el.style.outline = '';
        }
    });
}

// ─── Card Interaction ──────────────────────────────────────────────────
function onCardClick(idx, event) {
    State.cursor = idx;
    const img = State.images[idx];

    if (event.shiftKey || event.ctrlKey || event.metaKey) {
        // Multi-select for compare
        if (State.selected.has(img.id)) {
            State.selected.delete(img.id);
        } else {
            State.selected.add(img.id);
        }
        renderGrid();
        updateBulkBar();
        return;
    }

    // Single click — open detail
    openDetail(img);
    updateCursorHighlight();
}

// ─── Detail Sidebar ────────────────────────────────────────────────────
function openDetail(img) {
    State.detailId = img.id;
    const sb = document.getElementById('sidebar');
    sb.classList.add('visible');

    document.getElementById('detail-img').src = `/api/fullimage/${img.id}`;

    const meta = document.getElementById('detail-meta');
    const date = img.file_modified ? new Date(img.file_modified * 1000).toLocaleString() : '—';
    meta.innerHTML = `
        <div class="label">Filename</div>
        <div class="value">${escapeHtml(img.filename)}</div>
        <div class="label">Dimensions</div>
        <div class="value">${img.width || '?'}×${img.height || '?'}</div>
        <div class="label">Size</div>
        <div class="value">${(img.filesize / 1024).toFixed(0)} KB</div>
        <div class="label">Date</div>
        <div class="value">${escapeHtml(date)}</div>
        ${img.model ? `<div class="label">Model</div><div class="value">${escapeHtml(img.model)}</div>` : ''}
        ${img.seed ? `<div class="label">Seed</div><div class="value">${escapeHtml(String(img.seed))}</div>` : ''}
        ${img.quality_score != null ? `
            <div class="label">Quality Score</div>
            <div class="value" style="font-size:18px;font-weight:700;color:${img.quality_score >= 75 ? 'var(--good)' : img.quality_score >= 50 ? 'var(--warn)' : 'var(--bad)'}">${img.quality_score.toFixed(1)}<span style="font-size:12px;color:var(--text-dim);font-weight:400"> /100</span></div>
            <div class="value" style="font-size:11px;color:var(--text-dim)">
                Sharp: ${img.sharpness?.toFixed(0) || '—'} · Bright: ${img.brightness?.toFixed(2) || '—'} · Contrast: ${img.contrast?.toFixed(2) || '—'} · Sat: ${img.saturation?.toFixed(2) || '—'} · Entropy: ${img.entropy?.toFixed(2) || '—'}
            </div>
        ` : ''}
        ${img.rating ? `<div class="label">Rating</div><div class="value">${'★'.repeat(img.rating)}</div>` : ''}
        ${img.prompt ? `<div class="label">Prompt</div><div class="prompt-box">${escapeHtml(img.prompt)}</div>` : ''}
        ${img.notes ? `<div class="label">Notes</div><div class="value">${escapeHtml(img.notes)}</div>` : ''}
    `;

    // Update tags display
    const tagsDisplay = document.getElementById('detail-tags-display');
    tagsDisplay.textContent = img.tags || '';
    document.getElementById('tag-input').value = img.tags || '';
}

function closeDetail() {
    document.getElementById('sidebar').classList.remove('visible');
    State.detailId = null;
}

// ─── Actions ───────────────────────────────────────────────────────────
let _inputLocked = false;

// ─── Undo (global, Backspace / Ctrl+Z) ──────────────────────────────
const UndoStack = [];
function pushUndo(entry) {
    UndoStack.push(entry);
    if (UndoStack.length > 50) UndoStack.shift();
}
async function undoLast() {
    const u = UndoStack.pop();
    if (!u) { toast('Nothing to undo'); return; }
    try {
        await api(u.url, { method: 'POST', body: JSON.stringify(u.body) });
        const img = State.images.find(i => i.id === u.id);
        if (img) Object.assign(img, u.patch);
        if (State.detailId === u.id && img) openDetail(img);
        if (document.getElementById('preview').classList.contains('visible')
            && State.images[State.cursor] && State.images[State.cursor].id === u.id) {
            refreshPreview();
        }
        renderGrid();
        toast(u.label);
    } catch (e) {
        toast(`Undo failed: ${e.message}`);
    }
}

async function rateCurrent(rating) {
    if (State.detailId === null || _inputLocked) return;
    _inputLocked = true;
    try {
        const img = State.images.find(i => i.id === State.detailId);
        const prev = img ? (img.rating || 0) : 0;
        await api(`/api/image/${State.detailId}/rate`, {
            method: 'POST',
            body: JSON.stringify({ rating }),
        });
        if (img) img.rating = rating;
        pushUndo({ id: State.detailId, url: `/api/image/${State.detailId}/rate`,
            body: { rating: prev }, patch: { rating: prev },
            label: `Undone — rating back to ${'★'.repeat(prev) || 'none'}` });
        openDetail(img);
        renderGrid();
        await advanceCursor();
        toast(`Rated ${'★'.repeat(rating)}`);
    } finally {
        _inputLocked = false;
    }
}

async function toggleReject() {
    if (State.detailId === null || _inputLocked) return;
    _inputLocked = true;
    try {
        const img = State.images.find(i => i.id === State.detailId);
        const newRej = !img.rejected;
        await api(`/api/image/${State.detailId}/reject`, {
            method: 'POST',
            body: JSON.stringify({ rejected: newRej }),
        });
        img.rejected = newRej;
        const prevRej = !newRej; // value before this action
        pushUndo({ id: img.id, url: `/api/image/${img.id}/reject`,
            body: { rejected: prevRej }, patch: { rejected: prevRej },
            label: prevRej ? 'Undone — rejected again' : 'Undone — reject removed' });
        openDetail(img);
        renderGrid();
        if (newRej) {
            toast('Rejected — Backspace to undo');
            await advanceCursor();
        } else {
            toast('Un-rejected');
        }
    } finally {
        _inputLocked = false;
    }
}

async function toggleFlag() {
    if (State.detailId === null) return;
    const img = State.images.find(i => i.id === State.detailId);
    const newFlag = !img.flag;
    await api(`/api/image/${State.detailId}/flag`, {
        method: 'POST',
        body: JSON.stringify({ flag: newFlag }),
    });
    img.flag = newFlag;
    pushUndo({ id: img.id, url: `/api/image/${img.id}/flag`,
        body: { flag: !newFlag }, patch: { flag: !newFlag },
        label: newFlag ? 'Undone — flag removed' : 'Undone — flagged again' });
    openDetail(img);
    renderGrid();
    toast(newFlag ? 'Flagged ⚑' : 'Unflagged');
}

async function saveTags() {
    if (State.detailId === null) return;
    const tags = document.getElementById('tag-input').value.trim();
    await api(`/api/image/${State.detailId}/tags`, {
        method: 'POST',
        body: JSON.stringify({ tags }),
    });
    const img = State.images.find(i => i.id === State.detailId);
    if (img) img.tags = tags;
    document.getElementById('detail-tags-display').textContent = tags;
    toast(tags ? `Tags: ${tags}` : 'Tags cleared');
}

async function advanceCursor() {
    if (State.cursor < State.images.length - 1) {
        State.cursor++;
        const img = State.images[State.cursor];
        openDetail(img);
        updateCursorHighlight();
        saveState();
    } else {
        // At end of page - auto-load next page if available
        const totalPages = Math.ceil(State.total / State.limit) || 1;
        const currentPage = Math.floor(State.offset / State.limit) + 1;
        if (currentPage < totalPages) {
            State.offset += State.limit;
            State.cursor = 0;
            saveState();
            await loadImages();
            if (State.images.length > 0) {
                openDetail(State.images[0]);
                updateCursorHighlight();
            }
        }
    }
}

async function retreatCursor() {
    if (State.cursor > 0) {
        State.cursor--;
        const img = State.images[State.cursor];
        openDetail(img);
        updateCursorHighlight();
        saveState();
    } else if (State.offset > 0) {
        // At start of page — load previous page, go to last image
        State.offset = Math.max(0, State.offset - State.limit);
        State.cursor = State.limit - 1;
        await loadImages();
        if (State.images.length > 0) {
            State.cursor = State.images.length - 1;
            openDetail(State.images[State.cursor]);
            updateCursorHighlight();
        }
    }
}

// ─── Pagination ────────────────────────────────────────────────────────
function nextPage() {
    State.offset += State.limit;
    State.cursor = 0;
    saveState();
    loadImages();
}
function prevPage() {
    State.offset = Math.max(0, State.offset - State.limit);
    State.cursor = 0;
    saveState();
    loadImages();
}
function goToPage(p) {
    p = Math.max(1, Math.min(p, Math.ceil(State.total / State.limit) || 1));
    State.offset = (p - 1) * State.limit;
    State.cursor = 0;
    saveState();
    loadImages();
}

// ─── Compare ───────────────────────────────────────────────────────────
async function openCompare() {
    if (State.selected.size < 2) {
        toast('Select 2+ images (Ctrl+Click)');
        return;
    }
    const overlay = document.getElementById('compare');
    overlay.innerHTML = '';

    // Fetch metadata for all selected
    const imgs = [];
    for (const id of State.selected) {
        const data = await api(`/api/image/${id}`);
        imgs.push(data);
    }

    // Build compare cards
    for (const img of imgs) {
        const card = document.createElement('div');
        card.className = 'compare-card';

        const imageEl = document.createElement('img');
        imageEl.src = `/api/fullimage/${img.id}`;
        imageEl.className = 'compare-img';
        imageEl.dataset.id = img.id;
        card.appendChild(imageEl);

        // Metadata panel
        const meta = document.createElement('div');
        meta.className = 'compare-meta';
        const qs = img.quality_score != null ? img.quality_score.toFixed(1) : '—';
        const sharp = img.sharpness != null ? Math.round(img.sharpness) : '—';
        const rating = img.rating > 0 ? '★'.repeat(img.rating) : 'unrated';
        const prompt = img.prompt ? (img.prompt.length > 100 ? img.prompt.slice(0, 100) + '…' : img.prompt) : '—';
        const dim = img.width && img.height ? `${img.width}×${img.height}` : '—';
        const size = img.filesize ? `${(img.filesize / 1024).toFixed(0)} KB` : '—';
        const flagged = img.flag ? ' ⚑' : ''
        const rejected = img.rejected ? ' ✗' : '';

        meta.innerHTML = `
            <div class="compare-filename">${escapeHtml(img.filename)}${flagged}${rejected}</div>
            <div class="compare-row"><span>Quality</span><b>${qs}</b></div>
            <div class="compare-row"><span>Sharpness</span><b>${sharp}</b></div>
            <div class="compare-row"><span>Rating</span><b>${rating}</b></div>
            <div class="compare-row"><span>Dims</span><b>${dim}</b></div>
            <div class="compare-row"><span>Size</span><b>${size}</b></div>
            <div class="compare-row"><span>Model</span><b>${escapeHtml(img.model || '—')}</b></div>
            <div class="compare-prompt">${escapeHtml(prompt)}</div>
            <div class="compare-actions">
                <button class="btn" onclick="compareRate(${img.id}, 1)">★1</button>
                <button class="btn" onclick="compareRate(${img.id}, 2)">★2</button>
                <button class="btn" onclick="compareRate(${img.id}, 3)">★3</button>
                <button class="btn" onclick="compareRate(${img.id}, 4)">★4</button>
                <button class="btn" onclick="compareRate(${img.id}, 5)">★5</button>
                <button class="btn" onclick="compareReject(${img.id})">✗ Reject</button>
            </div>
        `;
        card.appendChild(meta);
        overlay.appendChild(card);
    }

    // Close button
    const closeBtn = document.createElement('button');
    closeBtn.className = 'btn compare-close';
    closeBtn.textContent = '✕ Close';
    closeBtn.onclick = closeCompare;
    overlay.appendChild(closeBtn);

    overlay.classList.add('visible');
}

async function compareRate(id, rating) {
    await api(`/api/image/${id}/rate`, {
        method: 'POST',
        body: JSON.stringify({ rating }),
    });
    const img = State.images.find(i => i.id === id);
    if (img) img.rating = rating;
    toast(`Rated ${'★'.repeat(rating)}`);
}

async function compareReject(id) {
    await api(`/api/image/${id}/reject`, {
        method: 'POST',
        body: JSON.stringify({ rejected: true }),
    });
    const img = State.images.find(i => i.id === id);
    if (img) img.rejected = true;
    toast('Rejected');
}

function closeCompare() {
    document.getElementById('compare').classList.remove('visible');
    document.getElementById('compare').innerHTML = '';
}

// ─── Bulk Actions ─────────────────────────────────────────────────────
function updateBulkBar() {
    const bar = document.getElementById('bulk-bar');
    const count = State.selected.size;
    bar.classList.toggle('visible', count > 0);
    document.getElementById('bulk-count').textContent = `${count} selected`;
}

function clearSelection() {
    State.selected.clear();
    renderGrid();
    updateBulkBar();
}

async function bulkRate(rating) {
    const ids = [...State.selected];
    for (const id of ids) {
        await api(`/api/image/${id}/rate`, {
            method: 'POST',
            body: JSON.stringify({ rating }),
        });
        const img = State.images.find(i => i.id === id);
        if (img) img.rating = rating;
    }
    toast(`Rated ${ids.length} images ${'★'.repeat(rating)}`);
    renderGrid();
    clearSelection();
}

async function bulkReject() {
    const ids = [...State.selected];
    for (const id of ids) {
        await api(`/api/image/${id}/reject`, {
            method: 'POST',
            body: JSON.stringify({ rejected: true }),
        });
        const img = State.images.find(i => i.id === id);
        if (img) img.rejected = true;
    }
    toast(`Rejected ${ids.length} images`, 'Undo', async () => {
        for (const id of ids) {
            await api(`/api/image/${id}/reject`, {
                method: 'POST',
                body: JSON.stringify({ rejected: false }),
            });
            const img = State.images.find(i => i.id === id);
            if (img) img.rejected = false;
        }
        renderGrid();
    });
    renderGrid();
    clearSelection();
}

// ─── Fullscreen Preview ────────────────────────────────────────────────
function openPreview() {
    if (State.cursor === null || !State.images[State.cursor]) return;
    const img = State.images[State.cursor];
    document.getElementById('preview-img').src = `/api/fullimage/${img.id}`;
    document.getElementById('preview').classList.add('visible');
}
function refreshPreview() {
    if (State.cursor === null || !State.images[State.cursor]) return;
    const img = State.images[State.cursor];
    document.getElementById('preview-img').src = `/api/fullimage/${img.id}`;
    updatePreviewHUD(img);
}

function updatePreviewHUD(img) {
    const hud = document.getElementById('preview-hud');
    const stars = '★'.repeat(img.rating || 0) + '☆'.repeat(5 - (img.rating || 0));
    const flags = [
        img.rejected ? '⊘ REJECTED' : '',
        img.flag ? '⚑ FLAGGED' : '',
    ].filter(Boolean).join('  ');
    hud.innerHTML = `<span class="preview-counter">${State.cursor + 1}/${State.total}</span> <span class="preview-stars">${stars}</span> ${flags ? '<span class="preview-flags">' + flags + '</span>' : ''}`;
}

async function rateInPreview(rating) {
    if (State.cursor === null || !State.images[State.cursor] || _inputLocked) return;
    _inputLocked = true;
    try {
        const img = State.images[State.cursor];
        const prev = img.rating || 0;
        await api(`/api/image/${img.id}/rate`, { method: 'POST', body: JSON.stringify({ rating }) });
        img.rating = rating;
        pushUndo({ id: img.id, url: `/api/image/${img.id}/rate`,
            body: { rating: prev }, patch: { rating: prev },
            label: `Undone — rating back to ${'★'.repeat(prev) || 'none'}` });
        updatePreviewHUD(img);
        renderGrid();
        await advanceCursor();
        refreshPreview();
    } finally {
        _inputLocked = false;
    }
}

async function rejectInPreview() {
    if (State.cursor === null || !State.images[State.cursor] || _inputLocked) return;
    _inputLocked = true;
    try {
        const img = State.images[State.cursor];
        const newRej = !img.rejected;
        await api(`/api/image/${img.id}/reject`, { method: 'POST', body: JSON.stringify({ rejected: newRej }) });
        img.rejected = newRej;
        pushUndo({ id: img.id, url: `/api/image/${img.id}/reject`,
            body: { rejected: !newRej }, patch: { rejected: !newRej },
            label: newRej ? 'Undone — reject removed' : 'Undone — rejected again' });
        updatePreviewHUD(img);
        renderGrid();
        if (newRej) {
            await advanceCursor();
            refreshPreview();
        }
    } finally {
        _inputLocked = false;
    }
}

function closePreview() {
    document.getElementById('preview').classList.remove('visible');
}

async function flagInPreview() {
    if (State.cursor === null || !State.images[State.cursor] || _inputLocked) return;
    _inputLocked = true;
    try {
        const img = State.images[State.cursor];
        const newFlag = !img.flag;
        await api(`/api/image/${img.id}/flag`, { method: 'POST', body: JSON.stringify({ flag: newFlag }) });
        img.flag = newFlag;
        pushUndo({ id: img.id, url: `/api/image/${img.id}/flag`,
            body: { flag: !newFlag }, patch: { flag: !newFlag },
            label: newFlag ? 'Undone — flag removed' : 'Undone — flagged again' });
        updatePreviewHUD(img);
        renderGrid();
    } finally {
        _inputLocked = false;
    }
}

// ─── Toast ─────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, actionLabel, actionFn) {
    const el = document.getElementById('toast');
    el.innerHTML = '';
    el.textContent = msg;
    if (actionLabel && actionFn) {
        const btn = document.createElement('button');
        btn.textContent = actionLabel;
        btn.style.cssText = 'background:none;border:1px solid var(--border);color:var(--accent);padding:2px 8px;border-radius:3px;cursor:pointer;font-size:12px;margin-left:8px;';
        btn.onclick = () => { actionFn(); el.classList.remove('visible'); };
        el.appendChild(btn);
    }
    el.classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('visible'), 3500);
}

// ─── Keyboard ──────────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
    // Ignore if typing in input
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') {
        if (e.key === 'Enter') {
            State.offset = 0;
            State.cursor = 0;
            loadImages();
        }
        return;
    }

    // Duel overlay open: it owns the keyboard
    if (document.getElementById('duel-overlay')?.classList.contains('visible')) return;

    if (e.key === 'Escape') {
        closePreview();
        closeCompare();
        closeDetail();
        if (DupeState.visible) closeDupes();
        return;
    }

    // In preview mode: allow navigation, rating, reject, flag — Lightroom-style rate-and-advance
    const inPreview = document.getElementById('preview').classList.contains('visible');
    if (inPreview) {
        switch (e.key) {
            case 'j': case 'ArrowRight': case 'ArrowDown':
                e.preventDefault(); advanceCursor().then(() => refreshPreview()); return;
            case 'k': case 'ArrowLeft': case 'ArrowUp':
                e.preventDefault(); retreatCursor().then(() => refreshPreview()); return;
            case '1': case '2': case '3': case '4': case '5':
                rateInPreview(parseInt(e.key)); e.preventDefault(); return;
            case '0':
                rateInPreview(0); e.preventDefault(); return;
            case 'x':
                rejectInPreview(); e.preventDefault(); return;
            case 'f':
                flagInPreview(); e.preventDefault(); return;
            case 'Backspace':
                e.preventDefault(); undoLast(); return;
            default: return;
        }
    }
    if (document.getElementById('compare').classList.contains('visible')) return;
    if (DupeState.visible) return; // dupe panel: gallery keys suppressed

    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
        undoLast(); e.preventDefault(); return;
    }

    switch (e.key) {
        case 'j': case 'ArrowRight': case 'ArrowDown':
            advanceCursor(); e.preventDefault(); break;
        case 'k': case 'ArrowLeft': case 'ArrowUp':
            retreatCursor(); e.preventDefault(); break;
        case '1': case '2': case '3': case '4': case '5':
            rateCurrent(parseInt(e.key)); e.preventDefault(); break;
        case '0':
            rateCurrent(0); break;
        case 'x':
            toggleReject(); break;
        case 'f':
            toggleFlag(); break;
        case ' ':
            openPreview(); e.preventDefault(); break;
        case 'c':
            openCompare(); break;
        case 'Backspace':
            undoLast(); e.preventDefault(); break;
    }
});
